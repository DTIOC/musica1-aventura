<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel 6 - La Forja Final</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.min.js"></script>
</head>
<body>
  <div class="puntos">⭐ Puntos: <span id="puntos">0</span></div>

  <div class="nivel-contenido">
    <div class="sendero"></div>
    <div class="avatar-container" id="avatar-container">
      <div class="avatar-bubble" id="avatar-bubble">¡A forjar la melodía!</div>
      <div class="avatar" id="avatar">🧙♂️</div>
    </div>

    <h1>🔨 Nivel 6: La Forja Final (Jefe)</h1>
    <p>Crea una melodía. <strong>Regla de oro:</strong> Después de un salto, la siguiente nota debe ir por grado conjunto en sentido inverso.</p>
    
    <div id="bloque-composicion">
      <div class="pregunta" style="text-align:center;">
        <strong>Haz clic en las notas para componer:</strong>
      </div>
      <div class="opciones" style="flex-direction: row; flex-wrap: wrap; justify-content: center;">
        <button class="opcion" onclick="agregarNota('C4')">Do</button>
        <button class="opcion" onclick="agregarNota('D4')">Re</button>
        <button class="opcion" onclick="agregarNota('E4')">Mi</button>
        <button class="opcion" onclick="agregarNota('F4')">Fa</button>
        <button class="opcion" onclick="agregarNota('G4')">Sol</button>
        <button class="opcion" onclick="agregarNota('A4')">La</button>
        <button class="opcion" onclick="agregarNota('B4')">Si</button>
        <button class="opcion" onclick="agregarNota('C5')">Do'</button>
      </div>
      
      <div id="pentagrama-visual"></div>
      <div id="mensaje" class="mensaje"></div>
    </div>

    <div id="bloque-final" class="oculto botones">
      <a href="index.html" class="btn btn-volver">← Volver al mapa</a>
      <a href="nivel7.html" class="btn btn-siguiente">¡Jefe Derrotado! Ver Diploma 🏆 →</a>
    </div>
  </div>

  <script>
    let puntos = parseInt(localStorage.getItem('puntosMusica1') || '0');
    document.getElementById('puntos').textContent = puntos;
    
    // Mover avatar al inicio
    setTimeout(() => {
      const bloque = document.getElementById('bloque-composicion');
      const avatarContainer = document.getElementById('avatar-container');
      avatarContainer.style.top = (bloque.offsetTop - 10) + 'px';
    }, 500);

    const notasAltura = { 'C':0, 'D':1, 'E':2, 'F':3, 'G':4, 'A':5, 'B':6 };
    let melodia = [];
    const synth = new Tone.Synth().toDestination();

    function extraerNota(nota) { return nota.replace(/[0-9]/g, ''); }
    function extraerOctava(nota) { return parseInt(nota.match(/[0-9]/)[0]); }
    function alturaMIDI(nota) { return notasAltura[extraerNota(nota)] + (extraerOctava(nota) * 7); }

    function agregarNota(nota) {
      synth.triggerAttackRelease(nota, "8n");
      melodia.push(nota);
      dibujarPentagrama();
      if (melodia.length >= 3) validarRegla();
    }

    function dibujarPentagrama() {
      const VF = Vex.Flow;
      const div = document.getElementById('pentagrama-visual');
      div.innerHTML = '';
      const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
      renderer.resize(750, 150);
      const context = renderer.getContext();
      const stave = new VF.Stave(10, 40, 730);
      stave.addClef("treble").addTimeSignature("4/4");
      stave.setContext(context).draw();
      
      const notasVF = melodia.map(n => {
        const nota = extraerNota(n).toLowerCase();
        const octava = extraerOctava(n);
        return new VF.StaveNote({ keys: [nota + "/" + octava], duration: "q" });
      });
      
      const voice = new VF.Voice({num_beats: melodia.length, beat_value: 4});
      voice.addTickables(notasVF);
      new VF.Formatter().joinVoices([voice]).format([voice], 700);
      voice.draw(context, stave);
    }

    function validarRegla() {
      const ultimas3 = melodia.slice(-3).map(alturaMIDI);
      const salto1 = Math.abs(ultimas3[1] - ultimas3[0]);
      const salto2 = Math.abs(ultimas3[2] - ultimas3[1]);
      const direccion1 = ultimas3[1] - ultimas3[0];
      const direccion2 = ultimas3[2] - ultimas3[1];

      const msg = document.getElementById('mensaje');
      const avatar = document.getElementById('avatar');
      const bubble = document.getElementById('avatar-bubble');

      if (salto1 > 1) {
        if (salto2 === 1 && Math.sign(direccion2) !== Math.sign(direccion1)) {
          msg.className = 'mensaje exito';
          msg.innerHTML = "✅ ¡Perfecto! Grado conjunto en sentido inverso. +5 puntos";
          puntos += 5;
          localStorage.setItem('puntosMusica1', puntos);
          document.getElementById('puntos').textContent = puntos;
          
          avatar.classList.add('happy');
          bubble.textContent = '¡Gran composición! ';
          bubble.classList.add('show');
          setTimeout(() => { avatar.classList.remove('happy'); bubble.classList.remove('show'); }, 2000);
        } else {
          msg.className = 'mensaje error';
          msg.innerHTML = "❌ Recuerda: después de un salto, debes ir por grado conjunto en sentido contrario.";
          
          avatar.classList.add('sad');
          bubble.textContent = '¡Cuidado con la regla! ⚠️';
          bubble.classList.add('show');
          setTimeout(() => { avatar.classList.remove('sad'); bubble.classList.remove('show'); }, 2000);
        }
      } else {
        msg.className = 'mensaje exito';
        msg.innerHTML = "🎵 Grado conjunto válido.";
      }

      // Mostrar botón final si hay al menos 4 notas
      if (melodia.length >= 4) {
        document.getElementById('bloque-final').classList.remove('oculto');
      }
    }

    function reiniciar() {
      melodia = [];
      document.getElementById('pentagrama-visual').innerHTML = '';
      document.getElementById('mensaje').innerHTML = "";
      document.getElementById('bloque-final').classList.add('oculto');
    }
  </script>
  <div style="text-align:center; margin-top:20px;">
    <button class="btn btn-volver" onclick="reiniciar()">🔄 Reiniciar Melodía</button>
  </div>
</body>
</html>
