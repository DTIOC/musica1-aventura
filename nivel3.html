<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel 3 - Biblioteca de Códigos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="puntos">⭐ Puntos: <span id="puntos">0</span></div>
  <div class="nivel-contenido">
    <div class="sendero"></div>
    <div class="avatar-container" id="avatar-container">
      <div class="avatar-bubble" id="avatar-bubble">¡Descifremos los códigos!</div>
      <div class="avatar" id="avatar">🧙‍♂️</div>
    </div>
    <h1>📚 Nivel 3: La Biblioteca de los Códigos Antiguos</h1>
    <p>Descifra los símbolos musicales para abrir las puertas secretas.</p>
    <div id="contenedor-preguntas"></div>
    <div id="bloque-final" class="oculto botones">
      <a href="index.html" class="btn btn-volver">← Volver al mapa</a>
      <a href="nivel4.html" class="btn btn-siguiente">¡Nivel Completado! Ir al Nivel 4 →</a>
    </div>
  </div>

  <script>
    const nivelActual = 3;
    const enlaceClassroom = "https://docs.google.com/presentation/d/1QeNvuWxr3uY22ZMqM5e7ix5_cKOWiF06-I0p5a7ZX48/edit?usp=sharing";
    const banco = [
      {id: '3_1', p: '¿Qué símbolo musical se utiliza para escribir las notas y tiene 5 líneas horizontales?', c: 'Pentagrama', i1: 'Clave de Sol', i2: 'Compás'},
      {id: '3_2', p: '¿Qué indica el símbolo crescendo (<)?', c: 'Aumentar la intensidad gradualmente', i1: 'Disminuir la intensidad', i2: 'Tocar muy suave'},
      {id: '3_3', p: 'La indicación 4/4 al inicio de una partitura nos indica:', c: 'El compás: 4 tiempos por compás, el cuarto dura un tiempo', i1: 'Que hay 4 notas en total', i2: 'La velocidad de la canción'},
      {id: '3_4', p: '¿Qué figura musical vale 1 tiempo en compás de 4/4?', c: 'Negra', i1: 'Blanca', i2: 'Redonda'},
      {id: '3_5', p: '¿Dónde se coloca la Clave de Sol en el pentagrama?', c: 'En la segunda línea', i1: 'En la primera línea', i2: 'En la tercera línea'},
      {id: '3_6', p: 'El símbolo que indica tocar suave es:', c: 'p (piano)', i1: 'f (forte)', i2: 'mf (mezzo forte)'},
      {id: '3_7', p: '¿Qué figura musical vale 4 tiempos?', c: 'Redonda', i1: 'Blanca', i2: 'Negra'},
      {id: '3_8', p: 'El silencio de negra tiene la misma duración que:', c: 'Una negra', i1: 'Una blanca', i2: 'Una redonda'},
      {id: '3_9', p: '¿Qué indica el símbolo de repetición (dos puntos)?', c: 'Repetir el fragmento musical', i1: 'Tocar más fuerte', i2: 'Terminar la canción'},
      {id: '3_10', p: 'La armadura de clave se coloca:', c: 'Al inicio del pentagrama, después de la clave', i1: 'Al final del pentagrama', i2: 'En medio del pentagrama'}
    ];

    let puntos = parseInt(localStorage.getItem('puntosMusica1') || '0');
    document.getElementById('puntos').textContent = puntos;
    let seleccionadas = JSON.parse(localStorage.getItem(`n${nivelActual}_sel`) || 'null');
    if (!seleccionadas) { seleccionadas = [...banco].sort(() => 0.5 - Math.random()).slice(0, 3).map(q => q.id); localStorage.setItem(`n${nivelActual}_sel`, JSON.stringify(seleccionadas)); }
    let respondidas = JSON.parse(localStorage.getItem(`n${nivelActual}_resp`) || '[]');
    let intentosSesion = {};

    const contenedor = document.getElementById('contenedor-preguntas');
    seleccionadas.forEach((id, idx) => {
      const q = banco.find(x => x.id === id);
      const yaRespondida = respondidas.includes(id);
      const opciones = [q.c, q.i1, q.i2].sort(() => 0.5 - Math.random());
      let opcionesHTML = '';
      opciones.forEach(op => {
        const esCorrecta = (op === q.c);
        const clase = yaRespondida && esCorrecta ? 'opcion correcta' : 'opcion';
        opcionesHTML += `<button class="${clase}" onclick="verificar(this, ${esCorrecta}, ${idx+1}, '${id}')" ${yaRespondida ? 'disabled' : ''}>${op}</button>`;
      });
      const div = document.createElement('div');
      div.id = `bloque-pregunta-${idx+1}`;
      div.className = (idx === 0 || yaRespondida) ? '' : 'oculto';
      div.innerHTML = `<div class="pregunta"><strong>Reto ${idx+1}:</strong> ${q.p}</div><div class="opciones">${opcionesHTML}</div><div id="mensaje${idx+1}" class="mensaje ${yaRespondida ? 'exito' : ''}">${yaRespondida ? '✅ ¡Ya completado!' : ''}</div>`;
      contenedor.appendChild(div);
    });

    function moverAvatarA(bloqueId) {
      const avatarContainer = document.getElementById('avatar-container');
      const bloque = document.getElementById(bloqueId);
      const bubble = document.getElementById('avatar-bubble');
      avatarContainer.classList.add('caminando');
      bubble.textContent = 'Caminando... 🚶‍♂️'; bubble.classList.add('show');
      setTimeout(() => {
        avatarContainer.style.top = (bloque.offsetTop - 10) + 'px';
        setTimeout(() => { avatarContainer.classList.remove('caminando'); bubble.textContent = '¡Llegamos!'; setTimeout(() => bubble.classList.remove('show'), 2000); }, 1500);
      }, 100);
    }

    function verificar(boton, esCorrecta, numPregunta, idPregunta) {
      intentosSesion[idPregunta] = (intentosSesion[idPregunta] || 0) + 1;
      const mensaje = document.getElementById(`mensaje${numPregunta}`);
      const opciones = boton.parentElement.querySelectorAll('.opcion');
      const avatar = document.getElementById('avatar');
      const bubble = document.getElementById('avatar-bubble');
      const q = banco.find(x => x.id === idPregunta);

      if (esCorrecta) {
        boton.classList.add('correcta'); mensaje.className = 'mensaje exito'; mensaje.innerHTML = '✅ ¡Correcto! +10 puntos';
        if (!respondidas.includes(idPregunta)) { puntos += 10; respondidas.push(idPregunta); localStorage.setItem('puntosMusica1', puntos); localStorage.setItem(`n${nivelActual}_resp`, JSON.stringify(respondidas)); document.getElementById('puntos').textContent = puntos; }
        avatar.classList.add('happy'); bubble.textContent = '¡Excelente! 🎉'; bubble.classList.add('show');
        setTimeout(() => { avatar.classList.remove('happy'); bubble.classList.remove('show'); }, 2000);
        opciones.forEach(op => op.disabled = true);
        const todas = seleccionadas.every(selId => respondidas.includes(selId));
        if (todas) { document.getElementById('bloque-final').classList.remove('oculto'); moverAvatarA('bloque-final'); }
        else { document.getElementById(`bloque-pregunta-${numPregunta+1}`).classList.remove('oculto'); moverAvatarA(`bloque-pregunta-${numPregunta+1}`); }
      } else {
        boton.classList.add('incorrecta'); boton.disabled = true;
        if (intentosSesion[idPregunta] >= 2) {
          mensaje.className = 'mensaje error'; mensaje.innerHTML = `⚠️ Necesitas un repaso. <br><a href="${enlaceClassroom}" target="_blank" style="color:#fbbf24; text-decoration:underline; font-weight:bold;">📚 Haz clic aquí para revisar el material</a>.`;
          if (!respondidas.includes(idPregunta)) { respondidas.push(idPregunta); localStorage.setItem(`n${nivelActual}_resp`, JSON.stringify(respondidas)); }
          opciones.forEach(op => { op.disabled = true; if (op.textContent === q.c) op.classList.add('correcta'); });
          const todas = seleccionadas.every(selId => respondidas.includes(selId));
          if (todas) { document.getElementById('bloque-final').classList.remove('oculto'); moverAvatarA('bloque-final'); }
          else { document.getElementById(`bloque-pregunta-${numPregunta+1}`).classList.remove('oculto'); moverAvatarA(`bloque-pregunta-${numPregunta+1}`); }
        } else {
          mensaje.className = 'mensaje error'; mensaje.innerHTML = '❌ Incorrecto. ¡Elige otra opción!';
        }
        avatar.classList.add('sad'); bubble.textContent = '¡Tú puedes! 💪'; bubble.classList.add('show');
        setTimeout(() => { avatar.classList.remove('sad'); bubble.classList.remove('show'); }, 2500);
      }
    }
  </script>
</body>
</html>
