<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel 4 - El Abismo de las Distancias</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="fondo-parallax fondo-abismo-bg" id="fondo-parallax"></div>
  
  <div class="puntos">⭐ Puntos: <span id="puntos">0</span></div>
  <div class="nivel-contenido">
    <div class="sendero"></div>
    <div class="avatar-container" id="avatar-container">
      <div class="avatar-bubble" id="avatar-bubble">¡Cuidado con el abismo!</div>
      <div class="avatar" id="avatar">🎵</div>
    </div>
    <h1>🕳️ Nivel 4: El Abismo de las Distancias</h1>
    <p>Para cruzar el abismo debes dominar la teoría de los intervalos.</p>
    <div id="contenedor-preguntas"></div>
    <div id="bloque-final" class="oculto botones">
      <a href="index.html" class="btn btn-volver">← Volver al mapa</a>
      <a href="nivel5.html" class="btn btn-siguiente">¡Nivel Completado! Ir al Nivel 5 →</a>
    </div>
  </div>

  <script>
    const nivelActual = 4;
    const enlaceClassroom = "https://docs.google.com/presentation/d/1QeNvuWxr3uY22ZMqM5e7ix5_cKOWiF06-I0p5a7ZX48/edit?usp=sharing";
    const banco = [
      {id: '4_1', p: '¿Qué son los intervalos?', c: 'La cantidad de notas entre dos de ellas', i1: 'La cantidad de tiempo entre dos de ellas', i2: 'La cantidad de figuras entre dos de ellas'},
      {id: '4_2', p: '¿Cómo se nombra a los intervalos?', c: 'Con números ordinales en femenino', i1: 'Con números romanos en masculino', i2: 'Con números arábigos en femenino'},
      {id: '4_3', p: 'Los reguladores sirven para', c: 'Incrementar o disminuir paulatinamente la intensidad del sonido', i1: 'Incrementar o disminuir paulatinamente la duración del sonido', i2: 'Incrementar o disminuir paulatinamente el tono del sonido'},
      {id: '4_4', p: 'El intervalo de Do4 a La4 se llama:', c: 'Sexta ascendente', i1: 'Sexta descendente', i2: 'Quinta ascendente'},
      {id: '4_5', p: 'Un grado conjunto es:', c: 'Cuando entre dos notas hay un intervalo de segunda', i1: 'Cuando entre dos notas hay un intervalos de tercera', i2: 'Cuando entre dos notas hay un unísono'},
      {id: '4_6', p: 'Un salto o grado disjunto es', c: 'Cuando entre dos notas hay un intervalo mayor al de segunda', i1: 'Cuando entre dos notas hay un intervalo menor al de tercera', i2: 'Cuando entre dos notas hay un intervalo de unísono'},
      {id: '4_7', p: 'La "regla" para hacer una melodía es:', c: 'Después de un salto la siguiente nota debe de ser por grado conjunto y en sentido contrario al salto', i1: 'Después de un grado conjunto la siguiente nota debe de ser por salto en sentido contrario al grado conjunto', i2: 'Después de un salto debe de ser cualquier nota'},
      {id: '4_8', p: 'La secuencia de Mi4, Fa4 y Sol4 ¿cuántos intervalos tiene?', c: 'Grado conjunto', i1: 'Por salto', i2: 'Son unísonos'},
      {id: '4_9', p: 'El intervalo de Sol4 a Si4 es de:', c: 'Tercera ascendente', i1: 'Tercera descendente', i2: 'Cuarta ascendente'},
      {id: '4_10', p: 'Después de ir de Mi4 a Sol4, la siguiente nota debe de ser:', c: 'Fa4', i1: 'Sol4', i2: 'La4'}
    ];

    let puntos = parseInt(localStorage.getItem('puntosMusica1') || '0');
    document.getElementById('puntos').textContent = puntos;

    let seleccionadas = JSON.parse(localStorage.getItem(`n${nivelActual}_sel`) || 'null');
    if (!seleccionadas) {
      seleccionadas = [...banco].sort(() => 0.5 - Math.random()).slice(0, 3).map(q => q.id);
      localStorage.setItem(`n${nivelActual}_sel`, JSON.stringify(seleccionadas));
    }

    let respondidas = JSON.parse(localStorage.getItem(`n${nivelActual}_resp`) || '[]');
    let intentosSesion = {};

    const contenedor = document.getElementById('contenedor-preguntas');
    let ultimaPreguntaRespondida = 0;

    seleccionadas.forEach((id, idx) => {
      const q = banco.find(x => x.id === id);
      const yaRespondida = respondidas.includes(id);
      const opciones = [q.c, q.i1, q.i2].sort(() => 0.5 - Math.random());
      let opcionesHTML = '';
      opciones.forEach(op => {
        const esCorrecta = (op === q.c);
        const clase = yaRespondida && esCorrecta ? 'opcion correcta' : 'opcion';
        opcionesHTML += `<button class="${clase}" onclick="verificar(this, ${esCorrecta}, ${idx+1}, '${id}')" ${yaRespondida ? 'disabled' : ''}>${op}</button>`;
      });
      const div = document.createElement('div');
      div.id = `bloque-pregunta-${idx+1}`;
      div.className = (idx === 0 || yaRespondida) ? '' : 'oculto';
      div.innerHTML = `<div class="pregunta"><strong>Reto ${idx+1}:</strong> ${q.p}</div><div class="opciones">${opcionesHTML}</div><div id="mensaje${idx+1}" class="mensaje ${yaRespondida ? 'exito' : ''}">${yaRespondida ? '✅ ¡Ya completado!' : ''}</div>`;
      contenedor.appendChild(div);
      if (yaRespondida) ultimaPreguntaRespondida = idx + 1;
    });

    setTimeout(() => {
      const avatarContainer = document.getElementById('avatar-container');
      if (ultimaPreguntaRespondida > 0) {
        const bloque = document.getElementById(`bloque-pregunta-${ultimaPreguntaRespondida}`);
        if (bloque) avatarContainer.style.top = (bloque.offsetTop - 10) + 'px';
      }
      const todasRespondidas = seleccionadas.every(selId => respondidas.includes(selId));
      if (todasRespondidas) {
        document.getElementById('bloque-final').classList.remove('oculto');
        const bloqueFinal = document.getElementById('bloque-final');
        avatarContainer.style.top = (bloqueFinal.offsetTop - 10) + 'px';
      }
      actualizarFondo();
    }, 300);

    function moverAvatarA(bloqueId) {
      const avatarContainer = document.getElementById('avatar-container');
      const bloque = document.getElementById(bloqueId);
      const bubble = document.getElementById('avatar-bubble');
      avatarContainer.classList.add('caminando');
      bubble.textContent = 'Caminando...'; bubble.classList.add('show');
      setTimeout(() => {
        avatarContainer.style.top = (bloque.offsetTop - 10) + 'px';
        actualizarFondo();
        setTimeout(() => { avatarContainer.classList.remove('caminando'); bubble.textContent = '¡Llegamos!'; setTimeout(() => bubble.classList.remove('show'), 2000); }, 1500);
      }, 100);
    }

    function verificar(boton, esCorrecta, numPregunta, idPregunta) {
      intentosSesion[idPregunta] = (intentosSesion[idPregunta] || 0) + 1;
      const mensaje = document.getElementById(`mensaje${numPregunta}`);
      const opciones = boton.parentElement.querySelectorAll('.opcion');
      const avatar = document.getElementById('avatar');
      const bubble = document.getElementById('avatar-bubble');
      const q = banco.find(x => x.id === idPregunta);

      if (esCorrecta) {
        boton.classList.add('correcta'); mensaje.className = 'mensaje exito'; mensaje.innerHTML = '✅ ¡Correcto! +10 puntos';
        if (!respondidas.includes(idPregunta)) {
          puntos += 10;
          respondidas.push(idPregunta);
          localStorage.setItem('puntosMusica1', puntos);
          localStorage.setItem(`n${nivelActual}_resp`, JSON.stringify(respondidas));
          document.getElementById('puntos').textContent = puntos;
        }
        avatar.classList.add('happy'); bubble.textContent = '¡Excelente! '; bubble.classList.add('show');
        setTimeout(() => { avatar.classList.remove('happy'); bubble.classList.remove('show'); }, 2000);
        opciones.forEach(op => op.disabled = true);
        const todas = seleccionadas.every(selId => respondidas.includes(selId));
        if (todas) {
          document.getElementById('bloque-final').classList.remove('oculto');
          moverAvatarA('bloque-final');
        } else {
          document.getElementById(`bloque-pregunta-${numPregunta+1}`).classList.remove('oculto');
          moverAvatarA(`bloque-pregunta-${numPregunta+1}`);
        }
      } else {
        boton.classList.add('incorrecta'); boton.disabled = true;
        if (intentosSesion[idPregunta] >= 2) {
          mensaje.className = 'mensaje error'; mensaje.innerHTML = `⚠️ Necesitas un repaso. <br><a href="${enlaceClassroom}" target="_blank" style="color:#fbbf24; text-decoration:underline; font-weight:bold;"> Haz clic aquí para revisar el material</a>.`;
          if (!respondidas.includes(idPregunta)) {
            respondidas.push(idPregunta);
            localStorage.setItem(`n${nivelActual}_resp`, JSON.stringify(respondidas));
          }
          opciones.forEach(op => { op.disabled = true; if (op.textContent === q.c) op.classList.add('correcta'); });
          const todas = seleccionadas.every(selId => respondidas.includes(selId));
          if (todas) {
            document.getElementById('bloque-final').classList.remove('oculto');
            moverAvatarA('bloque-final');
          } else {
            document.getElementById(`bloque-pregunta-${numPregunta+1}`).classList.remove('oculto');
            moverAvatarA(`bloque-pregunta-${numPregunta+1}`);
          }
        } else {
          mensaje.className = 'mensaje error'; mensaje.innerHTML = '❌ Incorrecto. ¡Elige otra opción!';
        }
        avatar.classList.add('sad'); bubble.textContent = '¡Tú puedes! 💪'; bubble.classList.add('show');
        setTimeout(() => { avatar.classList.remove('sad'); bubble.classList.remove('show'); }, 2500);
      }
    }

    function actualizarFondo() {
      const avatar = document.getElementById('avatar-container');
      const fondo = document.getElementById('fondo-parallax');
      if (avatar && fondo) {
        const posicionAvatar = avatar.offsetTop;
        const desplazamiento = -(posicionAvatar * 0.3);
        fondo.style.transform = `translateY(${desplazamiento}px)`;
      }
    }
    window.addEventListener('load', actualizarFondo);
    window.addEventListener('resize', actualizarFondo);
  </script>
</body>
</html>
