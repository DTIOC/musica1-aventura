<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel 1 - El Bosque del Eco</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="puntos">⭐ Puntos: <span id="puntos">0</span></div>

  <div class="nivel-contenido">
    <div class="sendero"></div>
    <div class="avatar-container" id="avatar-container">
      <div class="avatar-bubble" id="avatar-bubble">¡Comencemos el camino!</div>
      <div class="avatar" id="avatar">🎵</div>
    </div>

    <h1> Nivel 1: El Bosque del Eco</h1>
    <p>Avanza por el sendero respondiendo correctamente. ¡La música te acompañará!</p>
    
    <div id="contenedor-preguntas"></div>

    <div id="bloque-final" class="oculto botones">
      <a href="index.html" class="btn btn-volver">← Volver al mapa</a>
      <a href="nivel2.html" class="btn btn-siguiente">¡Nivel Completado! Ir al Nivel 2 →</a>
    </div>
  </div>

  <script>
    const nivelActual = 1;
    const enlaceClassroom = "https://docs.google.com/presentation/d/1QeNvuWxr3uY22ZMqM5e7ix5_cKOWiF06-I0p5a7ZX48/edit?usp=sharing";
    
    const banco = [
      {id: '1_1', p: '¿Cuáles son los tres elementos fundamentales de la música?', c: 'Sonido, Ritmo, Estructura', i1: 'Melodía, Armonía, Ritmo', i2: 'Tono, Timbre, Intensidad'},
      {id: '1_2', p: '¿Qué elemento se refiere a la organización del tiempo?', c: 'Ritmo', i1: 'Melodía', i2: 'Armonía'},
      {id: '1_3', p: 'La forma A-B-A es un ejemplo de:', c: 'Estructura musical', i1: 'Ritmo', i2: 'Timbre'},
      {id: '1_4', p: '¿Qué propiedad nos permite distinguir una flauta de un violín?', c: 'Timbre', i1: 'Tono', i2: 'Intensidad'},
      {id: '1_5', p: '¿Qué indica el símbolo "pp"?', c: 'Pianissimo (muy suave)', i1: 'Forte (fuerte)', i2: 'Mezzo forte'},
      {id: '1_6', p: '¿Cuál es la propiedad del sonido que se percibe mediante vibraciones?', c: 'Sonido', i1: 'Ritmo', i2: 'Melodía'},
      {id: '1_7', p: 'La melodía y la armonía son parte de:', c: 'Sonido', i1: 'Ritmo', i2: 'Estructura'},
      {id: '1_8', p: 'Es la manera en que se organiza la música:', c: 'Estructura', i1: 'Ritmo', i2: 'Sonido'},
      {id: '1_9', p: '¿Cómo se llama la música que no tiene sonido?', c: 'No existe', i1: 'Se llama silencio', i2: 'Se llama amusia'}
    ];

    let puntos = parseInt(localStorage.getItem('puntosMusica1') || '0');
    document.getElementById('puntos').textContent = puntos;

    let seleccionadas = JSON.parse(localStorage.getItem(`n${nivelActual}_sel`) || 'null');
    if (!seleccionadas) {
      seleccionadas = [...banco].sort(() => 0.5 - Math.random()).slice(0, 3).map(q => q.id);
      localStorage.setItem(`n${nivelActual}_sel`, JSON.stringify(seleccionadas));
    }

    let respondidas = JSON.parse(localStorage.getItem(`n${nivelActual}_resp`) || '[]');
    let intentosSesion = {};

    const contenedor = document.getElementById('contenedor-preguntas');
    let ultimaPreguntaRespondida = 0;

    seleccionadas.forEach((id, idx) => {
      const q = banco.find(x => x.id === id);
      const yaRespondida = respondidas.includes(id);
      const opciones = [q.c, q.i1, q.i2].sort(() => 0.5 - Math.random());

      let opcionesHTML = '';
      opciones.forEach(op => {
        const esCorrecta = (op === q.c);
        const clase = yaRespondida && esCorrecta ? 'opcion correcta' : 'opcion';
        const disabled = yaRespondida ? 'disabled' : '';
        opcionesHTML += `<button class="${clase}" onclick="verificar(this, ${esCorrecta}, ${idx+1}, '${id}')" ${disabled}>${op}</button>`;
      });

      const div = document.createElement('div');
      div.id = `bloque-pregunta-${idx+1}`;
      div.className = (idx === 0 || yaRespondida) ? '' : 'oculto';
      div.innerHTML = `
        <div class="pregunta"><strong>Reto ${idx+1}:</strong> ${q.p}</div>
        <div class="opciones">${opcionesHTML}</div>
        <div id="mensaje${idx+1}" class="mensaje ${yaRespondida ? 'exito' : ''}">${yaRespondida ? '✅ ¡Ya completado!' : ''}</div>
      `;
      contenedor.appendChild(div);
      
      if (yaRespondida) ultimaPreguntaRespondida = idx + 1;
    });

    // Mover avatar a la última pregunta respondida al cargar
    setTimeout(() => {
      const avatarContainer = document.getElementById('avatar-container');
      if (ultimaPreguntaRespondida > 0) {
        const bloque = document.getElementById(`bloque-pregunta-${ultimaPreguntaRespondida}`);
        if (bloque) avatarContainer.style.top = (bloque.offsetTop - 10) + 'px';
      }
      
      const todasRespondidas = seleccionadas.every(selId => respondidas.includes(selId));
      if (todasRespondidas) {
        document.getElementById('bloque-final').classList.remove('oculto');
        const bloqueFinal = document.getElementById('bloque-final');
        avatarContainer.style.top = (bloqueFinal.offsetTop - 10) + 'px';
      }
    }, 300);

    function moverAvatarA(bloqueId) {
      const avatarContainer = document.getElementById('avatar-container');
      const bloque = document.getElementById(bloqueId);
      const bubble = document.getElementById('avatar-bubble');
      avatarContainer.classList.add('caminando');
      bubble.textContent = 'Caminando al siguiente reto... ';
      bubble.classList.add('show');
      setTimeout(() => {
        const nuevaPosicion = bloque.offsetTop - 10; 
        avatarContainer.style.top = nuevaPosicion + 'px';
        setTimeout(() => {
          avatarContainer.classList.remove('caminando');
          bubble.textContent = '¡Llegamos! ¿Listo?';
          setTimeout(() => bubble.classList.remove('show'), 2000);
        }, 1500);
      }, 100);
    }

    function verificar(boton, esCorrecta, numPregunta, idPregunta) {
      intentosSesion[idPregunta] = (intentosSesion[idPregunta] || 0) + 1;
      const mensaje = document.getElementById(`mensaje${numPregunta}`);
      const opciones = boton.parentElement.querySelectorAll('.opcion');
      const avatar = document.getElementById('avatar');
      const bubble = document.getElementById('avatar-bubble');
      const q = banco.find(x => x.id === idPregunta);

      if (esCorrecta) {
        boton.classList.add('correcta');
        mensaje.className = 'mensaje exito';
        mensaje.innerHTML = '✅ ¡Correcto! +10 puntos';
        
        if (!respondidas.includes(idPregunta)) {
          puntos += 10;
          respondidas.push(idPregunta);
          localStorage.setItem('puntosMusica1', puntos);
          localStorage.setItem(`n${nivelActual}_resp`, JSON.stringify(respondidas));
          document.getElementById('puntos').textContent = puntos;
        }

        avatar.classList.add('happy');
        bubble.textContent = '¡Excelente! 🎉';
        bubble.classList.add('show');
        setTimeout(() => { avatar.classList.remove('happy'); bubble.classList.remove('show'); }, 2000);
        opciones.forEach(op => op.disabled = true);

        const todasRespondidas = seleccionadas.every(selId => respondidas.includes(selId));
        if (todasRespondidas) {
          document.getElementById('bloque-final').classList.remove('oculto');
          moverAvatarA('bloque-final');
        } else {
          document.getElementById(`bloque-pregunta-${numPregunta+1}`).classList.remove('oculto');
          moverAvatarA(`bloque-pregunta-${numPregunta+1}`);
        }
      } else {
        boton.classList.add('incorrecta');
        boton.disabled = true;

        if (intentosSesion[idPregunta] >= 2) {
          mensaje.className = 'mensaje error';
          mensaje.innerHTML = `⚠️ Necesitas un repaso. <br><a href="${enlaceClassroom}" target="_blank" style="color:#fbbf24; text-decoration:underline; font-weight:bold;">📚 Haz clic aquí para revisar el material</a>.<br><em>(Respuesta correcta marcada en verde).</em>`;
          if (!respondidas.includes(idPregunta)) {
            respondidas.push(idPregunta);
            localStorage.setItem(`n${nivelActual}_resp`, JSON.stringify(respondidas));
          }
          opciones.forEach(op => {
            op.disabled = true;
            if (op.textContent === q.c) op.classList.add('correcta');
          });
          
          const todasRespondidas = seleccionadas.every(selId => respondidas.includes(selId));
          if (todasRespondidas) {
            document.getElementById('bloque-final').classList.remove('oculto');
            moverAvatarA('bloque-final');
          } else {
            document.getElementById(`bloque-pregunta-${numPregunta+1}`).classList.remove('oculto');
            moverAvatarA(`bloque-pregunta-${numPregunta+1}`);
          }
        } else {
          mensaje.className = 'mensaje error';
          mensaje.innerHTML = '❌ Incorrecto. ¡Observa bien y elige otra opción!';
        }

        avatar.classList.add('sad');
        bubble.textContent = '¡Tú puedes! Revisa bien las opciones ';
        bubble.classList.add('show');
        setTimeout(() => { avatar.classList.remove('sad'); bubble.classList.remove('show'); }, 2500);
      }
    }
  </script>
</body>
</html>
