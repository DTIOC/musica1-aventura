<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel 7 - Diploma Final</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    body {
      background: #1a1a2e;
      min-height: 100vh;
      padding: 20px;
    }
    
    .diploma-container {
      max-width: 900px;
      margin: 40px auto;
      background: url('https://raw.githubusercontent.com/DTIOC/musica1-aventura/main/pergamino.png') no-repeat center center;
      background-size: contain;
      padding: 80px 60px 60px 60px;
      text-align: center;
      position: relative;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .diploma-container h1 {
      font-size: 3em;
      color: #5c3317;
      margin-bottom: 10px;
      font-family: 'Georgia', serif;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
    
    .diploma-container .subtitulo {
      font-size: 1.3em;
      color: #6b4423;
      margin-bottom: 20px;
      font-family: 'Georgia', serif;
    }
    
    .diploma-container .puntos-grandes {
      font-size: 4em;
      font-weight: bold;
      color: #b8860b;
      margin: 20px 0;
      font-family: 'Georgia', serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .certificado-box {
      background: rgba(255, 250, 240, 0.85);
      padding: 40px;
      border-radius: 10px;
      margin: 20px 0;
      border: 2px solid #8b7355;
      max-width: 700px;
      width: 100%;
    }
    
    .certificado-box h2 {
      font-size: 2.2em;
      color: #5c3317;
      margin-bottom: 20px;
      font-family: 'Georgia', serif;
    }
    
    .certificado-box p {
      font-size: 1.2em;
      color: #4a3728;
      margin: 15px 0;
      font-family: 'Georgia', serif;
    }
    
    .nombre-input {
      font-size: 1.5em;
      padding: 12px 25px;
      border: 2px solid #8b7355;
      border-radius: 8px;
      text-align: center;
      width: 80%;
      max-width: 450px;
      margin: 20px auto;
      display: block;
      font-family: 'Georgia', serif;
      background: rgba(255, 250, 240, 0.9);
      color: #5c3317;
    }
    
    .nombre-input::placeholder {
      color: #a0896c;
    }
    
    .certificado-box .fecha {
      font-size: 1em;
      color: #6b4423;
      margin-top: 25px;
      font-style: italic;
    }
    
    .botones-diploma {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    
    .btn-imprimir {
      background: #8b4513;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }
    
    .btn-imprimir:hover {
      background: #a0522d;
      transform: translateY(-2px);
    }
    
    .btn-volver {
      background: #6b4423;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }
    
    .btn-volver:hover {
      background: #8b5a3c;
      transform: translateY(-2px);
    }
    
    /* Estilos para impresión */
    @media print {
      body {
        background: white !important;
        padding: 0;
      }
      body * {
        visibility: hidden;
      }
      .diploma-container, .diploma-container * {
        visibility: visible;
      }
      .diploma-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 40px;
        background: url('https://raw.githubusercontent.com/DTIOC/musica1-aventura/main/pergamino.png') no-repeat center center !important;
        background-size: contain !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .botones-diploma {
        display: none !important;
      }
      .puntos {
        display: none !important;
      }
      .nombre-input {
        border: none;
        font-size: 1.8em;
        font-weight: bold;
        background: transparent;
      }
    }
  </style>
</head>
<body>
  <div class="puntos">⭐ Puntos Totales: <span id="puntos">0</span></div>
  
  <div class="diploma-container" id="diploma">
    <h1>🏆 ¡Felicidades! 🏆</h1>
    <div class="subtitulo">Has completado el curso de Música 1</div>
    
    <div class="puntos-grandes" id="puntos-display">0 puntos</div>
    
    <div class="certificado-box">
      <h2>Certificado de Logro</h2>
      <p>Se otorga el presente certificado a:</p>
      
      <input type="text" class="nombre-input" id="nombre-estudiante" placeholder="Escribe tu nombre aquí">
      
      <p>Por haber completado exitosamente todos los niveles del juego</p>
      <p style="font-size: 1.3em; font-weight: bold; color: #5c3317;">
        "El Misterio del Cristal Sonoro"
      </p>
      
      <div class="fecha">
        Fecha: <span id="fecha"></span>
      </div>
    </div>
  </div>
  
  <div class="botones-diploma">
    <button class="btn-volver" onclick="window.location.href='index.html'">
      ← Volver al menú
    </button>
    <button class="btn-imprimir" onclick="imprimirDiploma()">
      🖨️ Imprimir diploma
    </button>
  </div>

  <script>
    // Obtener puntos totales
    const puntosTotales = parseInt(localStorage.getItem('puntosMusica1') || '0');
    document.getElementById('puntos').textContent = puntosTotales;
    document.getElementById('puntos-display').textContent = puntosTotales + ' puntos';
    
    // Fecha actual
    const fecha = new Date();
    document.getElementById('fecha').textContent = fecha.toLocaleDateString('es-ES', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    
    function imprimirDiploma() {
      window.print();
    }
  </script>
</body>
</html>
