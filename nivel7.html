<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title> Diploma Final</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="nivel-contenido">
    <div class="diploma">
      <h1>🎓 ¡Felicidades!</h1>
      <p style="font-size: 1.3em;">Has completado el curso de Música 1</p>
      
      <div class="puntos-final">
        <span id="puntos-final">0</span> puntos
      </div>
      
      <div class="certificado">
        <h2>Certificado de Logro</h2>
        <p style="margin: 20px 0;">Se otorga el presente certificado a:</p>
        <input type="text" id="nombre-estudiante" placeholder="Escribe tu nombre aquí" 
               style="font-size: 1.2em; padding: 10px; width: 80%; text-align: center; border: 2px solid #1a1a2e; border-radius: 5px;">
        <p style="margin: 20px 0;">Por haber completado exitosamente todos los niveles del juego<br>
        <strong>"El Misterio del Cristal Sonoro"</strong></p>
        <p style="margin-top: 30px; font-size: 0.9em; color: #666;">
          Fecha: <span id="fecha"></span>
        </p>
      </div>
      
      <div class="botones" style="margin-top: 30px;">
        <button class="btn" onclick="window.print()">️ Imprimir diploma</button>
        <a href="index.html" class="btn btn-volver">← Volver al menú</a>
      </div>
    </div>
  </div>

  <script>
    // Cargar puntos totales
    const puntos = localStorage.getItem('puntosMusica1') || 0;
    document.getElementById('puntos-final').textContent = puntos;
    
    // Poner la fecha de hoy automáticamente
    const fecha = new Date();
    document.getElementById('fecha').textContent = fecha.toLocaleDateString('es-ES', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  </script>
</body>
</html>
