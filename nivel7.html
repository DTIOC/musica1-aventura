<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel 7 - Diploma Final</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    body {
      background: #1a1a2e;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .diploma-wrapper {
      position: relative;
      max-width: 900px;
      width: 100%;
      margin: 40px auto;
    }
    
    .pergamino-bg {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .diploma-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Padding más generoso para mantener todo dentro del pergamino */
      padding: 18% 20% 22% 20%;
      box-sizing: border-box;
      text-align: center;
    }
    
    .diploma-content h1 {
      font-size: 2.2em;
      color: #5c3317;
      margin: 0 0 8px 0;
      font-family: 'Georgia', serif;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
    }
    
    .diploma-content .subtitulo {
      font-size: 1.1em;
      color: #6b4423;
      margin-bottom: 10px;
      font-family: 'Georgia', serif;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
    }
    
    .diploma-content .puntos-grandes {
      font-size: 3em;
      font-weight: bold;
      color: #b8860b;
      margin: 10px 0;
      font-family: 'Georgia', serif;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
    }
    
    .certificado-texto {
      margin: 5px 0;
    }
    
    .certificado-texto h2 {
      font-size: 1.8em;
      color: #5c3317;
      margin-bottom: 10px;
      font-family: 'Georgia', serif;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
    }
    
    .certificado-texto p {
      font-size: 1em;
      color: #4a3728;
      margin: 8px 0;
      font-family: 'Georgia', serif;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
    }
    
    .nombre-input {
      font-size: 1.5em;
      padding: 8px 15px;
      border: none;
      border-bottom: 2px solid #8b7355;
      text-align: center;
      width: 70%;
      max-width: 350px;
      margin: 10px auto;
      display: block;
      font-family: 'Georgia', serif;
      background: transparent;
      color: #5c3317;
      font-weight: bold;
    }
    
    .nombre-input::placeholder {
      color: #a0896c;
      font-style: italic;
    }
    
    .certificado-texto .fecha {
      font-size: 0.95em;
      color: #6b4423;
      margin-top: 15px;
      font-style: italic;
    }
    
    .botones-diploma {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    
    .btn-imprimir {
      background: #8b4513;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }
    
    .btn-imprimir:hover {
      background: #a0522d;
      transform: translateY(-2px);
    }
    
    .btn-volver {
      background: #6b4423;
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }
    
    .btn-volver:hover {
      background: #8b5a3c;
      transform: translateY(-2px);
    }
    
    /* Estilos para impresión */
    @media print {
      body {
        background: white !important;
        padding: 0;
        margin: 0;
      }
      body * {
        visibility: hidden;
      }
      .diploma-wrapper, .diploma-wrapper * {
        visibility: visible;
      }
      .diploma-wrapper {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
      }
      .pergamino-bg {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .botones-diploma {
        display: none !important;
      }
      .puntos {
        display: none !important;
      }
      .nombre-input {
        border-bottom: 2px solid #8b7355;
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="puntos">⭐ Puntos Totales: <span id="puntos">0</span></div>
  
  <div class="diploma-wrapper">
    <img src="https://raw.githubusercontent.com/DTIOC/musica1-aventura/main/pergamino.png" alt="Pergamino" class="pergamino-bg">
    
    <div class="diploma-content">
      <h1>🏆 ¡Felicidades! 🏆</h1>
      <div class="subtitulo">Has completado el curso de Música 1</div>
      
      <div class="puntos-grandes" id="puntos-display">0 puntos</div>
      
      <div class="certificado-texto">
        <h2>Certificado de Logro</h2>
        <p>Se otorga el presente certificado a:</p>
        
        <input type="text" class="nombre-input" id="nombre-estudiante" placeholder="Escribe tu nombre aquí">
        
        <p>Por haber completado exitosamente todos los niveles del juego</p>
        <p style="font-size: 1.1em; font-weight: bold; color: #5c3317;">
          "El Misterio del Cristal Sonoro"
        </p>
        
        <div class="fecha">
          Fecha: <span id="fecha"></span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="botones-diploma">
    <button class="btn-volver" onclick="window.location.href='index.html'">
      ← Volver al menú
    </button>
    <button class="btn-imprimir" onclick="imprimirDiploma()">
      ️ Imprimir diploma
    </button>
  </div>

  <script>
    // Obtener puntos totales
    const puntosTotales = parseInt(localStorage.getItem('puntosMusica1') || '0');
    document.getElementById('puntos').textContent = puntosTotales;
    document.getElementById('puntos-display').textContent = puntosTotales + ' puntos';
    
    // Fecha actual
    const fecha = new Date();
    document.getElementById('fecha').textContent = fecha.toLocaleDateString('es-ES', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    
    function imprimirDiploma() {
      window.print();
    }
  </script>
</body>
</html>
