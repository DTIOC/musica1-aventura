<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nivel 7 - Diploma Final</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="puntos">⭐ Puntos Totales: <span id="puntos">0</span></div>
  
  <div class="diploma-pergamino" id="diploma">
    <h1>🏆 ¡Felicidades! 🏆</h1>
    
    <div class="certificado-text">
      <p>Has completado exitosamente</p>
      <p><strong>El Misterio del Cristal Sonoro</strong></p>
      <p>y demostrado tu dominio de la música</p>
    </div>
    
    <div class="nombre-estudiante">
      🎵 Gran Músico 
    </div>
    
    <div class="certificado-text">
      <p>Puntuación Final:</p>
      <div class="puntos-final" id="puntos-final">0</div>
      <p>¡Eres un maestro de la melodía!</p>
    </div>
    
    <div style="margin-top: 40px; font-size: 0.9em; color: #8b7355;">
      <p> Fecha: <span id="fecha"></span></p>
    </div>
  </div>
  
  <div class="botones" style="text-align: center; margin: 30px;">
    <button class="btn btn-volver" onclick="window.location.href='index.html'">
      ← Volver al mapa
    </button>
    <button class="btn btn-siguiente btn-imprimir" onclick="imprimirDiploma()">
      🖨️ Imprimir Diploma
    </button>
  </div>

  <script>
    // Obtener puntos totales
    const puntosTotales = parseInt(localStorage.getItem('puntosMusica1') || '0');
    document.getElementById('puntos').textContent = puntosTotales;
    document.getElementById('puntos-final').textContent = puntosTotales + ' ⭐';
    
    // Fecha actual
    const fecha = new Date();
    document.getElementById('fecha').textContent = fecha.toLocaleDateString('es-ES', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    
    function imprimirDiploma() {
      window.print();
    }
  </script>
</body>
</html>
